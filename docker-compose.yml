services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: seeker
      POSTGRES_PASSWORD: seeker
      POSTGRES_DB: seeker
    volumes:
      - seeker_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeker -d seeker"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  seeker_pg_data:
